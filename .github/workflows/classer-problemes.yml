name: Classement par problème de santé
on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Nombre maximal d'études à classer (50 = échantillon de test)"
        required: false
        default: '50'
      afficher_detail:
        description: "Afficher le classement de chaque étude dans le log (true/false)"
        required: false
        default: 'true'
permissions:
  contents: read
jobs:
  classer:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm install @supabase/supabase-js
      - name: Classer les études
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMITE: ${{ github.event.inputs.limite || '50' }}
          AFFICHER_DETAIL: ${{ github.event.inputs.afficher_detail || 'true' }}
        run: node scripts/classer-problemes.js
