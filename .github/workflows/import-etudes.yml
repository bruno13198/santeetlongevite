name: Import études scientifiques
on:
  schedule:
    - cron: '43 2 * * 1'   # lundi 2h43 UTC, avant la saturation du matin européen
    - cron: '13 6 * * 1'   # lundi 6h13 UTC, second essai (GitHub saute parfois un créneau)
    - cron: '37 10 * * 1'  # lundi 10h37 UTC, troisième essai
    - cron: '21 15 * * 1'  # lundi 15h21 UTC, filet de sécurité de l'après-midi
    # Chaque essai ne tourne que si aucun run planifié n'a déjà réussi dans la journée.
  workflow_dispatch:
    inputs:
      offset:
        description: 'Offset de départ (0, 200, 400, ...)'
        required: false
        default: '0'
      limite:
        description: 'Nombre d''aliments à traiter'
        required: false
        default: '2000'
      jours_veille:
        description: 'Fenêtre de recherche en jours (10 par défaut)'
        required: false
        default: '10'
      resultats_a_recuperer:
        description: 'Résultats Europe PMC examinés par sujet (vide = valeur du script)'
        required: false
        default: ''
      max_nouvelles_etudes:
        description: 'Nouvelles études max par sujet et par run (vide = valeur du script)'
        required: false
        default: ''
      max_analyses:
        description: 'Analyses Claude max par sujet et par run (vide = valeur du script)'
        required: false
        default: ''
      slugs_cibles:
        description: 'Slugs d''aliments ciblés séparés par virgules (vide = tous les aliments)'
        required: false
        default: ''
concurrency:
  group: import-etudes
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    outputs:
      deja_fait: ${{ steps.check.outputs.deja_fait }}
    steps:
      - name: Vérifier si un run planifié a déjà réussi aujourd'hui
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Lancement manuel : pas de vérification."
            echo "deja_fait=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AUJOURDHUI=$(date -u +%Y-%m-%d)
          NB=$(gh run list --repo "${{ github.repository }}" --workflow "${{ github.workflow }}" \
                --event schedule --limit 10 --json databaseId,conclusion,createdAt \
              | jq --arg d "$AUJOURDHUI" --argjson moi ${{ github.run_id }} \
                '[.[] | select(.databaseId != $moi) | select(.createdAt | startswith($d)) | select(.conclusion == "success")] | length')
          if [ "$NB" -gt 0 ]; then
            echo "Un run planifié a déjà réussi aujourd'hui : on s'arrête."
            echo "deja_fait=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun run réussi aujourd'hui : on lance l'import."
            echo "deja_fait=false" >> "$GITHUB_OUTPUT"
          fi

  import:
    needs: verifier
    if: needs.verifier.outputs.deja_fait != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm install @supabase/supabase-js
      - name: Lancer le script d'import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OFFSET: ${{ github.event.inputs.offset || '0' }}
          LIMITE: ${{ github.event.inputs.limite || '2000' }}
          JOURS_VEILLE: ${{ github.event.inputs.jours_veille || '10' }}
          RESULTATS_A_RECUPERER: ${{ github.event.inputs.resultats_a_recuperer }}
          MAX_NOUVELLES_ETUDES_PAR_RUN: ${{ github.event.inputs.max_nouvelles_etudes }}
          MAX_ANALYSES_PAR_RUN: ${{ github.event.inputs.max_analyses }}
          SLUGS_CIBLES: ${{ github.event.inputs.slugs_cibles || '' }}
        run: node scripts/import-etudes.js
      - name: Lancer le script d'import des habitudes alimentaires
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOURS_VEILLE: ${{ github.event.inputs.jours_veille || '10' }}
          RESULTATS_A_RECUPERER: ${{ github.event.inputs.resultats_a_recuperer }}
          MAX_NOUVELLES_ETUDES_PAR_RUN: ${{ github.event.inputs.max_nouvelles_etudes }}
          MAX_ANALYSES_PAR_RUN: ${{ github.event.inputs.max_analyses }}
        run: node scripts/import-habitudes.js
      - name: Lancer le script d'import des nutriments, compléments et plantes
        # Ajouté le 14 oct. 2026. Si cette étape échoue, les alertes partent quand même.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOURS_VEILLE: ${{ github.event.inputs.jours_veille || '10' }}
          RESULTATS_A_RECUPERER: ${{ github.event.inputs.resultats_a_recuperer }}
          MAX_NOUVELLES_ETUDES_PAR_RUN: ${{ github.event.inputs.max_nouvelles_etudes }}
          MAX_ANALYSES_PAR_RUN: ${{ github.event.inputs.max_analyses }}
          ESTIMATION_SEULE: 'false'
        run: node scripts/import-nutriments.js
            - name: Classer les nouvelles études par problème de santé
        # Ajouté le 21 oct. 2026 : ne traite que les études pas encore classées.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMITE: '3000'
          AFFICHER_DETAIL: 'false'
        run: node scripts/classer-problemes.js
      - name: Envoyer les alertes email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: node scripts/envoyer-alertes.js
