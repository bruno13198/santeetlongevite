name: Import études scientifiques
on:
  schedule:
    - cron: '0 3 * * 1'  # tous les lundis à 3h UTC
  workflow_dispatch:
    inputs:
      offset:
        description: 'Offset de départ (0, 200, 400, ...)'
        required: false
        default: '0'
      limite:
        description: 'Nombre d''aliments à traiter'
        required: false
        default: '2000'
      jours_veille:
        description: 'Fenêtre de recherche en jours (10 par défaut)'
        required: false
        default: '10'
      resultats_a_recuperer:
        description: 'Nombre de résultats Europe PMC à examiner par aliment (20 par défaut)'
        required: false
        default: '20'
      max_nouvelles_etudes:
        description: 'Nombre max de nouvelles études ajoutées par aliment (8 par défaut)'
        required: false
        default: '8'
      slugs_cibles:
        description: 'Slugs ciblés séparés par virgules (vide = tous les aliments)'
        required: false
        default: ''
concurrency:
  group: import-etudes
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm install @supabase/supabase-js
      - name: Lancer le script d'import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OFFSET: ${{ github.event.inputs.offset || '0' }}
          LIMITE: ${{ github.event.inputs.limite || '2000' }}
          JOURS_VEILLE: ${{ github.event.inputs.jours_veille || '10' }}
          RESULTATS_A_RECUPERER: ${{ github.event.inputs.resultats_a_recuperer || '20' }}
          MAX_NOUVELLES_ETUDES_PAR_RUN: ${{ github.event.inputs.max_nouvelles_etudes || '8' }}
          SLUGS_CIBLES: ${{ github.event.inputs.slugs_cibles || '' }}
        run: node scripts/import-etudes.js
