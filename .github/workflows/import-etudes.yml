name: Import études scientifiques
on:
  workflow_dispatch:
    inputs:
      offset:
        description: 'Offset de départ (0, 200, 400, ...)'
        required: true
        default: '0'
      limite:
        description: 'Nombre d''aliments à traiter'
        required: true
        default: '200'
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm install @supabase/supabase-js
      - name: Lancer le script d'import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OFFSET: ${{ github.event.inputs.offset }}
          LIMITE: ${{ github.event.inputs.limite }}
        run: node scripts/import-etudes.js
