name: Import habitudes alimentaires

on:
  workflow_dispatch:
    inputs:
      slugs_cibles:
        description: 'Slugs ciblés séparés par virgules (vide = tous)'
        required: false
        default: ''
      jours_veille:
        description: 'Fenêtre de recherche en jours (10 par défaut)'
        required: false
        default: '10'
      hauts_niveaux:
        description: 'Seulement méta-analyses d''essais randomisés et de cohortes prospectives'
        type: choice
        options: ['false', 'true']
        default: 'false'
      resultats_a_recuperer:
        description: 'Résultats Europe PMC lus par habitude (200 par défaut)'
        required: false
        default: '200'
      max_analyses:
        description: 'Analyses Sonnet maximum par habitude (80 par défaut)'
        required: false
        default: '80'
      max_nouvelles_etudes:
        description: 'Nouvelles études maximum par habitude (50 par défaut)'
        required: false
        default: '50'

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm install @supabase/supabase-js
      - name: Lancer le script d'import des habitudes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUGS_CIBLES: ${{ github.event.inputs.slugs_cibles || '' }}
          JOURS_VEILLE: ${{ github.event.inputs.jours_veille || '10' }}
          HAUTS_NIVEAUX: ${{ github.event.inputs.hauts_niveaux || 'false' }}
          RESULTATS_A_RECUPERER: ${{ github.event.inputs.resultats_a_recuperer || '200' }}
          MAX_ANALYSES_PAR_RUN: ${{ github.event.inputs.max_analyses || '80' }}
          MAX_NOUVELLES_ETUDES_PAR_RUN: ${{ github.event.inputs.max_nouvelles_etudes || '50' }}
        run: node scripts/import-habitudes.js
