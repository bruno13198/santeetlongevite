name: Import habitudes alimentaires

on:
  workflow_dispatch:
    inputs:
      slugs_cibles:
        description: 'Slugs ciblés séparés par virgules (vide = tous)'
        required: false
        default: ''
      jours_veille:
        description: 'Fenêtre de recherche en jours (10 par défaut)'
        required: false
        default: '10'

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm install @supabase/supabase-js
      - name: Lancer le script d'import des habitudes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUGS_CIBLES: ${{ github.event.inputs.slugs_cibles || '' }}
          JOURS_VEILLE: ${{ github.event.inputs.jours_veille || '10' }}
        run: node scripts/import-habitudes.js
