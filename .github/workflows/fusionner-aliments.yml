name: Fusionner aliments en doublon

on:
  workflow_dispatch:
    inputs:
      mode_simulation:
        description: 'true = rapport seul, aucune écriture. false = applique la fusion.'
        required: false
        default: 'true'

jobs:
  fusionner:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm install @supabase/supabase-js
      - name: Lancer la fusion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE_SIMULATION: ${{ github.event.inputs.mode_simulation }}
        run: node scripts/fusionner-aliments.js
