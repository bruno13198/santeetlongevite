name: Rattrapage des métadonnées bibliographiques

on:
  schedule:
    - cron: '41 4 1 * *'   # le 1er de chaque mois à 4h41 UTC : mode « compléter »
  workflow_dispatch:
    inputs:
      mode:
        description: 'nouvelles = études sans revue ni DOI ; completer = études parues depuis (volume, pages)'
        required: true
        default: 'completer'
        type: choice
        options: ['completer', 'nouvelles']
      ecrire:
        description: 'Enregistrer en base ? (false = test)'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
      limite:
        description: "Nombre maximal d'études (vide = toutes)"
        required: false
        default: ''

jobs:
  rattraper:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install @supabase/supabase-js
      - run: node scripts/rattraper-metadonnees.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ github.event.inputs.mode || 'completer' }}
          ECRIRE: ${{ github.event.inputs.ecrire || 'true' }}
          LIMITE: ${{ github.event.inputs.limite || '1000000' }}
