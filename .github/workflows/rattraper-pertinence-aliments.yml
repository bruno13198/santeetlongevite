name: Auditer pertinence des études (terme_recherche vs nom)

on:
  workflow_dispatch:
    inputs:
      lot_actuel:
        description: 'Numéro du lot à traiter (0 à 9)'
        required: false
        default: '0'
      mode_simulation:
        description: 'true = rapport seul, aucune écriture. false = applique les retraits.'
        required: false
        default: 'true'

jobs:
  auditer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm install @supabase/supabase-js
      - name: Lancer le script d'audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOT_ACTUEL: ${{ github.event.inputs.lot_actuel }}
          MODE_SIMULATION: ${{ github.event.inputs.mode_simulation }}
        run: node scripts/rattraper-pertinence-aliments.js
