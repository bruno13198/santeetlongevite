name: Comptage de littérature (gratuit)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compter:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compter les études sur Europe PMC
        run: node scripts/compter-litterature.js
      - name: Enregistrer le fichier CSV
        uses: actions/upload-artifact@v4
        with:
          name: comptage-litterature
          path: comptage-litterature.csv
