name: Générer termes de recherche multiples

on:
  workflow_dispatch:
    inputs:
      slugs_cibles:
        description: 'Slugs précis (vide = traiter par lots)'
        required: false
        default: ''
      lot_actuel:
        description: 'Numéro du lot (0 à 9), ignoré si slugs_cibles est rempli'
        required: false
        default: '0'
      nb_lots:
        description: 'Nombre de lots au total'
        required: false
        default: '10'
      forcer:
        description: 'true = regénérer même les aliments déjà pourvus'
        required: false
        default: 'false'

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm install @supabase/supabase-js
      - name: Lancer la génération
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUGS_CIBLES: ${{ github.event.inputs.slugs_cibles }}
          LOT_ACTUEL: ${{ github.event.inputs.lot_actuel }}
          NB_LOTS: ${{ github.event.inputs.nb_lots }}
          FORCER: ${{ github.event.inputs.forcer }}
        run: node scripts/generer-termes-multiples.js
