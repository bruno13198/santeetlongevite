name: Générer termes de recherche multiples

on:
  workflow_dispatch:
    inputs:
      slugs_cibles:
        description: 'Slugs à traiter, séparés par des virgules'
        required: true
        default: ''

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm install @supabase/supabase-js
      - name: Lancer la génération
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUGS_CIBLES: ${{ github.event.inputs.slugs_cibles }}
        run: node scripts/generer-termes-multiples.js
