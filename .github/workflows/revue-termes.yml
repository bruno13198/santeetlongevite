name: Revue des termes de recherche (ponctuel)

on:
  workflow_dispatch:
    inputs:
      limite_fiches:
        description: 'Nombre de fiches pour un test (0 = toutes)'
        required: false
        default: '20'

jobs:
  revue:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm install @supabase/supabase-js
      - name: Lancer la revue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMITE_FICHES: ${{ github.event.inputs.limite_fiches || '20' }}
        run: node scripts/revue-termes.js
      - name: Mettre les fichiers à disposition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revue-termes
          path: |
            propositions.json
            revue-termes.csv
          retention-days: 14
