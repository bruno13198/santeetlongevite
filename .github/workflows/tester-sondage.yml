name: Test des prompts sur le sondage
# 25 nov. 2026 : relance les prompts améliorés (sens par fiche, classement par problème) sur les
# cas d'une table de test. Affiche ancien et nouveau résultat ; n'enregistre rien.
on:
  workflow_dispatch:
    inputs:
      table:
        description: 'Table des cas à tester (test_sondage ou test_sondage2)'
        required: false
        default: 'test_sondage2'
permissions:
  contents: read
jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dépendances
        run: npm install @supabase/supabase-js@2.45.0 --no-save
      - name: Lancer le test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TABLE_TEST: ${{ github.event.inputs.table || 'test_sondage2' }}
        run: node scripts/tester-sondage.js
